    <!-- React Flow CSS -->
    <link href="https://cdn.jsdelivr.net/npm/@xyflow/react@12.3.0/dist/style.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
              secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
              destructive: { DEFAULT: "hsl(var(--destructive))", foreground: "hsl(var(--destructive-foreground))" },
              muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
              accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
              card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
            },
            borderRadius: {
              lg: "var(--radius)",
              md: "calc(var(--radius) - 2px)",
              sm: "calc(var(--radius) - 4px)",
            },
            keyframes: {
              "fly-to-queue": {
                "0%": { transform: "translate(0, 0) scale(1)", opacity: "1" },
                "80%": { opacity: "1" },
                "100%": { transform: "translate(var(--tw-translate-x), var(--tw-translate-y)) scale(0.2)", opacity: "0" }
              },
              "pulse-strong": {
                "0%, 100%": { opacity: "1" },
                "50%": { opacity: "0.5", transform: "scale(0.95)" }
              }
            },
            animation: {
              "fly-to-queue": "fly-to-queue 1s cubic-bezier(0.22, 1, 0.36, 1) forwards",
              "pulse-strong": "pulse-strong 2s cubic-bezier(0.4, 0, 0.6, 1) infinite"
            }
          },
        },
      }
    </script>
    <script>
      window.process = window.process || {};
      window.process.env = window.process.env || {};
      if (!window.process.env.NODE_ENV) window.process.env.NODE_ENV = 'development';
    </script>
